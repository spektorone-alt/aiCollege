<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>מכללת וולט</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app shell — sticky bar, hash-routed views (home / year / course / projects), floating "ask" button that opens a two-stage tutor sheet */
:root{
  --bg:#eef3f7; --surface:#ffffff; --surface-2:#f5f8fb; --ink:#10202f; --muted:#526477; --line:#d3dde7;
  --brand:#0b5cad; --brand-ink:#ffffff; --volt:#f2b705; --volt-ink:#2a1f00;
  --y1:#0b5cad; --y1-soft:#e2edf9; --y2:#0f7a5c; --y2-soft:#dff2eb; --y3:#b4531b; --y3-soft:#f8e7dc; --pj:#6b3fa0; --pj-soft:#efe6f8;
  --ok:#17784a; --warn:#a4400f; --warn-soft:#fbe9df;
  --shadow:0 1px 0 rgba(16,32,47,.05),0 10px 30px -18px rgba(16,32,47,.35);
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c141c; --surface:#131e29; --surface-2:#182533; --ink:#e7eef5; --muted:#9db0c3; --line:#26384a;
  --brand:#6aaef0; --brand-ink:#08121c; --volt:#f6c93a; --volt-ink:#1f1700;
  --y1:#6aaef0; --y1-soft:#152c44; --y2:#4fd1a5; --y2-soft:#11302a; --y3:#f2985f; --y3-soft:#3a2214; --pj:#c39cf0; --pj-soft:#2a1d3d;
  --ok:#6fd8a1; --warn:#f5a97a; --warn-soft:#3a2216;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c141c; --surface:#131e29; --surface-2:#182533; --ink:#e7eef5; --muted:#9db0c3; --line:#26384a;
  --brand:#6aaef0; --brand-ink:#08121c; --volt:#f6c93a; --volt-ink:#1f1700;
  --y1:#6aaef0; --y1-soft:#152c44; --y2:#4fd1a5; --y2-soft:#11302a; --y3:#f2985f; --y3-soft:#3a2214; --pj:#c39cf0; --pj-soft:#2a1d3d;
  --ok:#6fd8a1; --warn:#f5a97a; --warn-soft:#3a2216;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.7); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
.num{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;font-size:.92em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:start;min-width:0}
.logo b{font-family:var(--f-display);font-size:21px;font-weight:400;white-space:nowrap}
.logo small{display:block;font-size:13px;color:var(--muted);line-height:1.2;white-space:nowrap}
.navs{display:flex;gap:6px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none}
.navs::-webkit-scrollbar{display:none}
.nv{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:15px;min-height:40px;transition:background .2s,border-color .2s}
.nv[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:640px){.navs{display:none}.logo small{display:none}}

main{padding-block:22px 120px}
.view{animation:enter .35s ease both}
@keyframes enter{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

/* home hero */
.hero{display:grid;gap:14px;padding-block:8px 22px}
.eyebrow{font:700 13px var(--f-mono);letter-spacing:.12em;color:var(--brand)}
.hero h1{font-size:clamp(34px,7.5vw,58px)}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--volt) 62%);padding-inline:4px}
.hero .lead{color:var(--muted);font-size:19px;max-width:58ch}
.askbig{display:flex;gap:8px;background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:6px;box-shadow:var(--shadow);max-width:640px}
.askbig input{flex:1;min-width:0;border:0;background:transparent;font:600 17px var(--f-body);color:var(--ink);padding:10px 12px}
.askbig input:focus{outline:none}
.askbig:focus-within{border-color:var(--brand)}
.go{flex:none;border:0;border-radius:12px;background:var(--volt);color:var(--volt-ink);font-weight:800;padding:10px 18px;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--brand);color:var(--brand)}

/* big tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:6px}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
.tile{--c:var(--y1);--cs:var(--y1-soft);position:relative;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;text-align:start;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;cursor:pointer;box-shadow:var(--shadow);overflow:hidden;
  transition:transform .25s cubic-bezier(.2,.7,.2,1),border-color .25s}
.tile::after{content:"";position:absolute;inset:auto 0 0 0;height:5px;background:var(--c);transform:scaleX(.18);transform-origin:right;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.tile:hover{transform:translateY(-4px);border-color:var(--c)}
.tile:hover::after,.tile:focus-visible::after{transform:scaleX(1)}
.tile .glyph{grid-row:span 2;width:64px;height:64px;border-radius:16px;background:var(--cs);color:var(--c);display:grid;place-items:center;font:400 34px var(--f-display)}
.tile .tt{font:400 25px var(--f-display)}
.tile .ts{color:var(--muted);font-size:15px}
.tile .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--cs,var(--surface-2));color:var(--c,var(--muted))}
.tile.y2{--c:var(--y2);--cs:var(--y2-soft)} .tile.y3{--c:var(--y3);--cs:var(--y3-soft)} .tile.pj{--c:var(--pj);--cs:var(--pj-soft)}

.how{margin-top:30px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:720px){.how{grid-template-columns:1fr}}
.how > div{border-top:3px solid var(--line);padding-top:12px}
.how b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;margin-bottom:2px}
.how p{color:var(--muted);font-size:15px}
.stepn{font:700 13px var(--f-mono);color:var(--brand)}

/* year / course */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px;color:var(--muted);margin-bottom:10px}
.crumbs button{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;font-weight:700}
.vhead{--c:var(--y1);--cs:var(--y1-soft);background:var(--cs);border-radius:22px;padding:22px;display:grid;gap:6px;margin-bottom:18px}
.vhead.y2{--c:var(--y2);--cs:var(--y2-soft)} .vhead.y3{--c:var(--y3);--cs:var(--y3-soft)} .vhead.pj{--c:var(--pj);--cs:var(--pj-soft)}
.vhead .eyebrow{color:var(--c)}
.vhead h1{font-size:clamp(30px,6vw,44px)}
.vhead p{color:var(--muted);max-width:60ch}
.courses{display:grid;gap:14px}
.course{--c:var(--y1);display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;text-align:start;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.course:hover{transform:translateY(-2px);border-color:var(--c)}
.course h2{font-size:23px}
.course p{color:var(--muted);font-size:15px;grid-column:1}
.course .arrow{grid-row:1/span 2;grid-column:2;width:46px;height:46px;border-radius:50%;background:var(--c);color:var(--surface);display:grid;place-items:center}
.course .meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.y2 .course,.course.y2{--c:var(--y2)} .y3 .course,.course.y3{--c:var(--y3)}

.chap{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.chap > button{width:100%;display:flex;gap:12px;align-items:center;text-align:start;background:none;border:0;padding:14px 16px;cursor:pointer;min-height:58px}
.chap .cn{flex:none;width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font:700 15px var(--f-mono)}
.chap .ct{flex:1;font-weight:800;font-size:18px;min-width:0}
.chap .st{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
.chap .st.ready{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.chap .chev{flex:none;transition:transform .25s}
.chap.open .chev{transform:rotate(180deg)}
.chap .body{display:none;padding:0 16px 16px;border-top:1px dashed var(--line)}
.chap.open .body{display:block}
.chap ul{margin:12px 0;padding-inline-start:22px}
.chap li{margin-bottom:4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:transparent;border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:44px;text-decoration:none;color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.volt{background:var(--volt);color:var(--volt-ink);border-color:var(--volt)}
.linkcard{display:flex;gap:12px;align-items:center;background:var(--y1-soft);border-radius:14px;padding:14px 16px;margin-bottom:14px;color:var(--ink);text-decoration:none;font-weight:700}
.linkcard span{flex:1;min-width:0}
.linkcard small{display:block;font-weight:400;color:var(--muted)}

/* projects */
.pipeline{display:grid;gap:0;counter-reset:s;margin:6px 0 22px}
.pstep{display:grid;grid-template-columns:44px 1fr;gap:4px 14px;position:relative;padding-bottom:16px}
.pstep::before{counter-increment:s;content:counter(s);width:44px;height:44px;border-radius:50%;background:var(--pj);color:var(--surface);display:grid;place-items:center;font:700 17px var(--f-mono);grid-row:span 2;z-index:1}
.pstep:not(:last-child)::after{content:"";position:absolute;inset-inline-start:21px;top:44px;bottom:0;width:2px;background:var(--pj-soft)}
.pstep b{font-size:18px}
.pstep p{color:var(--muted);font-size:15px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:22px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:6px;align-content:start}
.idea .tag{width:max-content}
.idea b{font-size:17px}
.idea p{color:var(--muted);font-size:15px}
.sec-t{font-size:26px;margin:8px 0 12px}
.book{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.book li{padding:8px 0;border-bottom:1px dashed var(--line)}
.book li:last-child{border-bottom:0}
.book ol{margin:0;padding-inline-start:22px}

/* FAB + tutor sheet */
.fab{position:fixed;z-index:25;inset-inline-end:max(16px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;background:var(--volt);color:var(--volt-ink);font-weight:800;font-size:17px;padding:14px 20px;cursor:pointer;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.45)}
.fab .pulse{width:10px;height:10px;border-radius:50%;background:var(--volt-ink);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.sheet{position:fixed;z-index:40;inset:auto 0 0 auto;width:min(440px,100%);height:min(640px,calc(100% - 40px));display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -10px 50px -12px rgba(0,0,0,.45);
  padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
[dir="rtl"] .sheet{inset:auto auto 0 0}
@media (min-width:700px){.sheet,[dir="rtl"] .sheet{inset:auto auto 18px 18px;border-radius:22px}}
.sheet.open{transform:none}
.shead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.shead b{font-family:var(--f-display);font-weight:400;font-size:20px;flex:1}
.status{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted)}
.status.on{background:var(--ok);color:var(--surface)}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;place-items:center}
.ctxbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface-2);font-size:14px;color:var(--muted)}
.ctxbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctxbar button{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer}
.log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;border-radius:16px;padding:10px 14px;font-size:16px;line-height:1.6;overflow-wrap:anywhere}
.msg.u{align-self:flex-start;background:var(--ink);color:var(--bg);border-end-start-radius:4px}
.msg.b{align-self:flex-end;background:var(--surface-2);border:1px solid var(--line);border-end-end-radius:4px}
.msg .src{display:inline-block;font:700 11px var(--f-mono);letter-spacing:.06em;border-radius:6px;padding:1px 7px;margin-bottom:6px}
.src.kb{background:var(--y2-soft);color:var(--y2)} .src.ai{background:var(--y1-soft);color:var(--y1)}
.msg .q{font-weight:800;margin-bottom:4px}
.msg ul{margin:6px 0;padding-inline-start:20px}
.msg code{font-family:var(--f-mono);font-size:.9em;background:var(--surface);border-radius:4px;padding:0 4px;direction:ltr;unicode-bidi:isolate}
.msg .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.msg .acts button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;cursor:pointer;min-height:36px}
.msg .acts button.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.msg.err{border-color:var(--warn);background:var(--warn-soft)}
.keep{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.keep button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;cursor:pointer;min-height:36px}
.keep form{display:flex;gap:6px;width:100%}
.keep input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 15px var(--f-body);padding:6px 10px;direction:ltr;text-align:left}
.keep .note{font-size:14px;font-weight:700}
.keep .note.ok{color:var(--ok)} .keep .note.bad{color:var(--warn)}
.shot{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;gap:12px;overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.shot p{color:#fff;font-weight:700;text-align:center;margin:0}
.shot img{max-width:min(520px,100%);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.shot .row{justify-content:center}
.shot .btn{background:#fff;color:#10202f;border-color:#fff}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.compose textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);color:var(--ink);font:500 16px var(--f-body);padding:10px 12px;max-height:120px}
.compose textarea:focus{outline:2px solid var(--brand);outline-offset:0}
.compose .go{min-height:46px}
.icb{flex:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icb:hover{border-color:var(--brand);color:var(--brand)}
.attach{display:flex;align-items:center;gap:10px;padding:8px 12px 0}
.attach img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.attach span{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.attach .x{width:36px;height:36px}
.msg.u img{display:block;max-width:220px;max-height:220px;border-radius:10px;margin-bottom:6px}
.camhero{flex:none;width:46px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
@media (min-width:700px){.scrim{display:none}}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div dir="rtl" lang="he">
<header class="top">
  <div class="wrap gut bar">
    <button class="logo" type="button" data-go="home" aria-label="לדף הבית">
      <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><rect x="1" y="1" width="36" height="36" rx="10" fill="var(--ink)"/><path d="M21 6 11 21h7l-2.5 11L27 16h-7z" fill="var(--volt)"/></svg>
      <span><b>מכללת וולט</b><small>הנדסאי חשמל · מסלול וירטואלי</small></span>
    </button>
    <nav class="navs" aria-label="ניווט ראשי">
      <button class="nv" type="button" data-go="year1">שנה א</button>
      <button class="nv" type="button" data-go="year2">שנה ב</button>
      <button class="nv" type="button" data-go="year3">שנה ג</button>
      <button class="nv" type="button" data-go="projects">פרויקטים</button>
    </nav>
  </div>
</header>

<main class="wrap gut" id="main" tabindex="-1"></main>

<button class="fab" type="button" id="fab" aria-controls="sheet" aria-expanded="false"><span class="pulse" aria-hidden="true"></span>שאלה למרצה</button>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheetTitle" hidden>
  <div class="shead">
    <b id="sheetTitle">העוזר של המכללה</b>
    <span class="status" id="aiStatus">מאגר בלבד</span>

 {c:"machines",q:"מה יחס ההשנאה בשנאי?",k:"שנאי יחס השנאה ליפופים ראשוני משני",a:"בשנאי אידיאלי:\n**V1 / V2 = N1 / N2 = I2 / I1**\nהמתח עולה עם מספר הליפופים, והזרם יורד באותו יחס, כך שההספק בשני הצדדים שווה."},
 {c:"machines",q:"מה מודדים בניסוי ריקם ובניסוי קצר של שנאי?",k:"ניסוי ריקם קצר שנאי הפסדי ברזל נחושת",a:"**ניסוי ריקם** (מתח נקוב, משני פתוח): ההספק הנמדד הוא בקירוב הפסדי הברזל, וממנו מחשבים את הענף המקבילי (Rc, Xm).\n**ניסוי קצר** (משני מקוצר, זרם נקוב במתח נמוך): ההספק הנמדד הוא בקירוב הפסדי הנחושת, וממנו מחשבים את עכבת הקצר (Req, Xeq)."},
 {c:"machines",q:"מתי נצילות השנאי מרבית?",k:"נצילות מרבית שנאי הפסדים",a:"הנצילות מרבית כשהפסדי הנחושת (התלויים בעומס) שווים להפסדי הברזל (הקבועים).\nהעומס היחסי שבו זה קורה: **x = √(Pfe / Pcu,נקוב)**."},
 {c:"machines",q:"איך מחשבים מהירות סינכרונית?",k:"מהירות סינכרונית קטבים תדר סל\"ד מנוע השראה",a:"**ns = 120 · f / p** [סל\"ד], כש-p הוא מספר הקטבים.\nב-50Hz: שני קטבים → 3000, ארבעה → 1500, שישה → 1000 סל\"ד."},
 {c:"machines",q:"איך מחשבים החלקה במנוע השראה?",k:"החלקה מנוע השראה אסינכרוני מהירות רוטור",a:"**s = (ns − n) / ns**, כש-n היא מהירות הרוטור.\nבעומס נקוב ההחלקה בדרך כלל 2%–6%. תדר זרמי הרוטור: fr = s·f."},
 {c:"machines",q:"למה משתמשים בהתנעת כוכב-משולש?",k:"התנעה כוכב משולש זרם התנעה מנוע",a:"מתניעים בחיבור כוכב ועוברים למשולש. בכוכב מתח המופע קטן פי √3, ולכן **זרם הקו בהתנעה ומומנט ההתנעה יורדים לשליש** מאשר בהתנעה ישירה במשולש. מתאים לעומס עם מומנט התנעה נמוך."},
 {c:"machines",q:"מה קובע את המהירות של מנוע זרם ישר?",k:"מנוע זרם ישר מהירות עירור שטף כאמ נגדי",a:"הכא\"מ הנגדי: E = k·Φ·n, ולכן:\n**n = (V − Ia·Ra) / (k·Φ)**\nאפשר לשנות מהירות דרך מתח העוגן (V) או דרך השטף (זרם העירור). הקטנת השטף מעלה את המהירות."},
 {c:"power",q:"איך מדליקים ומכבים תיריסטור?",k:"תיריסטור scr הצתה שער זרם החזקה כיבוי",a:"**הדלקה:** פולס זרם לשער, כשהמתח בין האנודה לקתודה חיובי.\n**כיבוי:** אי אפשר דרך השער. התיריסטור נכבה רק כשהזרם יורד מתחת לזרם ההחזקה, למשל במעבר האפס של רשת החילופין."},
 {c:"power",q:"מה המתח הממוצע במיישר מבוקר?",k:"מיישר מבוקר זווית הצתה אלפא מתח ממוצע גשר",a:"- **חצי גל, עומס התנגדותי:** Vdc = (Vm / 2π)·(1 + cosα)\n- **גשר חד-פאזי מלא, זרם רציף (עומס השראי):** Vdc = (2Vm / π)·cosα\n- **גשר תלת-פאזי:** Vdc = (3√2 / π)·VL·cosα ≈ 1.35·VL·cosα"},
 {c:"power",q:"מה המתח ביציאה של ממיר Buck ו-Boost?",k:"buck boost ממיר מוריד מעלה מחזור עבודה dc dc",a:"במצב זרם רציף, כש-D הוא מחזור העבודה:\n**Buck:** Vo = D · Vin\n**Boost:** Vo = Vin / (1 − D)"},
 {c:"power",q:"למה שומרים על V/f קבוע בממיר תדר?",k:"ממיר תדר v/f בקרת מהירות שטף מנוע",a:"השטף במנוע יחסי ל-V/f. אם מורידים תדר בלי להוריד מתח, הליבה נכנסת לרוויה והזרם עולה. שמירה על **V/f קבוע** שומרת על שטף ומומנט זמין קבועים בתחום שמתחת לתדר הנקוב."},
 {c:"psys",q:"איך עובדים עם יחידות פר-יוניט?",k:"פר יוניט per unit בסיס עכבה pu",a:"**Zbase = V²base / Sbase**, ו-Zpu = Z / Zbase.\nמעבר בסיס: **Zחדש = Zישן · (Vישן / Vחדש)² · (Sחדש / Sישן)**.\nהיתרון: עכבת השנאי זהה בשני צדדיו, וקל להשוות בין ציוד."},
 {c:"psys",q:"איך מחשבים זרם קצר תלת-פאזי?",k:"זרם קצר תלת פאזי הספק קצר סימטרי",a:"ביחידות פר-יוניט, עם מתח לפני התקלה 1pu:\n**Isc,pu = 1 / Zpu**, ולכן Isc = Ibase / Zpu.\nהספק הקצר: **Ssc = Sbase / Zpu**."},
 {c:"psys",q:"איך מחשבים מפל מתח בקו?",k:"מפל מתח קו תמסורת ויסות",a:"בקירוב לקו קצר (למופע):\n**ΔV ≈ I · (R·cosφ + X·sinφ)**\nבתלת-פאזי, למתח הקו מכפילים ב-√3."},
 {c:"install",q:"איך בוחרים חתך מוליך?",k:"חתך מוליך כבל בחירה זרם מותר הגנה",a:"1. מחשבים את זרם העומס **IB**.\n2. בוחרים הגנה עם זרם נקוב **In**.\n3. בוחרים מוליך שזרם המותר שלו **IZ**, אחרי מקדמי תיקון לטמפרטורה ולצורת ההתקנה, מקיים IB ≤ In ≤ IZ.\n4. בודקים מפל מתח ומגדילים חתך אם צריך."},
 {c:"install",q:"איך מחשבים מפל מתח חד-פאזי במתקן?",k:"מפל מתח חד פאזי מתקן אורך כבל נחושת",a:"לעומס התנגדותי: **ΔV = 2 · I · L · ρ / A**\nL אורך הקו במטרים (2 בגלל הלוך-חזור), A החתך במ\"מ², ולנחושת ρ ≈ 0.0175 Ω·mm²/m."},
 {c:"install",q:"איך עובד ממסר פחת?",k:"ממסר פחת זרם דלף rcd מפסק מגן חשמול",a:"הממסר משווה בין הזרם בפאזה לזרם באפס. אם יש הפרש, הזרם דולף דרך מסלול אחר, למשל דרך גוף אדם או הארקה, והממסר מנתק. ממסר עם רגישות 30mA הוא הנפוץ להגנה על אנשים."},
 {c:"install",q:"איך מחשבים קבלים לשיפור כופל הספק?",k:"שיפור כופל הספק קבלים מקדם הספק kvar",a:"**Qc = P · (tanφ1 − tanφ2)**\nφ1 הזווית הנוכחית ו-φ2 הזווית הרצויה. לדוגמה: 100kW משיפור 0.8 ל-0.95 → Qc ≈ 100·(0.75 − 0.329) ≈ 42kVAR."},
 {c:"projects",q:"מה המבנה של ספר פרויקט?",k:"ספר פרויקט מבנה פרויקט גמר כתיבה פרקים",a:"המבנה המקובל: תקציר, מבוא ומטרות, רקע תאורטי, תכנון (חישובים ובחירת רכיבים), ביצוע, בדיקות ותוצאות, סיכום ומסקנות, מקורות ונספחים. הרשימה המלאה מופיעה בעמוד הפרויקטים."},

function go(route){
  if (location.hash.slice(1) !== route) { try { history.pushState(null, "", "#" + route); } catch(e) { location.hash = route; } }
  render();
}
function render(){
  const r = location.hash.slice(1) || "home";
  document.querySelectorAll(".nv").forEach(b => b.setAttribute("aria-current", r.startsWith(b.dataset.go) || (r.startsWith("c-") && courseYear(r.slice(2)) === b.dataset.go) ? "page" : "false"));
  if (r.startsWith("c-")) courseView(r.slice(2));
  else if (r === "projects") projectsView();
  else if (YEARS.some(y => y.id === r)) yearView(r);
  else homeView();
  main.firstElementChild?.classList.add("view");
  window.scrollTo({top:0});
}

function md(t){
  const lines = esc(t).split("\n"); let out = "", inList = false;
  for (const ln of lines) {
    const li = ln.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + inl(li[1]) + "</li>"; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    out += ln.trim() ? inl(ln) + "<br>" : "<br>";
  }
  if (inList) out += "</ul>";
  return out.replace(/(<br>)+$/, "");
}
const inl = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/^#{1,4}\s*(.*)$/, "<b>$1</b>");

function addMsg(cls, html){ const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }

/* חיפוש במאגר */
const STOP = new Set("מה איך למה מתי של את על עם זה זו הוא היא יש אין או גם כל אני אתה מחשבים מחשב לחשב חישוב עובד עובדת אומר אומרים בין הם הן לי לו כן לא".split(" "));
const PRE = "והבלמשכ";
function toks(s){
  return s.toLowerCase().replace(/[֑-ׇ"'״׳?.,:;!()\/\-–]/g, " ").split(/\s+/).filter(w => w && !STOP.has(w))
    .flatMap(w => { const v = [w]; if (w.length > 3 && PRE.includes(w[0])) { v.push(w.slice(1)); if (w.length > 4 && PRE.includes(w[1])) v.push(w.slice(2)); } return v.filter(x => !STOP.has(x)); });
}
const KBT = KB.map(e => ({e, k:new Set(toks(e.k)), q:new Set(toks(e.q))}));
function words(s){
  return s.toLowerCase().replace(/[\u0591-\u05C7"'״׳?.,:;!()\/\-–]/g, " ").split(/\s+/).filter(w => w && !STOP.has(w))
    .map(w => { const v = [w]; if (w.length > 3 && PRE.includes(w[0])) { v.push(w.slice(1)); if (w.length > 4 && PRE.includes(w[1])) v.push(w.slice(2)); } return v; });
}
function wscore(vs, k, q){
  let best = 0;
  for (const t of vs) {
    if (k.has(t)) best = Math.max(best, 1);
    else if (q.has(t)) best = Math.max(best, .7);
    else if (t.length > 3 && [...k].some(x => x.length > 3 && (x.startsWith(t) || t.startsWith(x)))) best = Math.max(best, .5);
  }
  return best;
}
function searchKB(q){
  const ws = words(q); if (!ws.length) return [];
  return KBT.map(({e, k, q:qq}) => {
    let s = 0; for (const vs of ws) s += wscore(vs, k, qq);
    let r = s / ws.length;
    if (ctx && e.c === ctx.id) r += .1;
    return {e, s:r, raw:s};
  }).filter(r => r.raw >= 1).sort((a, b) => b.s - a.s);
}

async function ask(q){
  addMsg("u", esc(q));
  const hits = searchKB(q);
  if (hits.length && hits[0].s >= CONFIG.kbThreshold) {
    const h = hits[0].e;
    const m = bot(`<span class="src kb">מהמאגר · ${esc(courseName(h.c))}</span><div class="q">${esc(h.q)}</div>${md(h.a)}
      <div class="acts"><button type="button" class="ok">זה ענה לי</button><button type="button" class="pri more">שאלה ל-Volt בכל זאת</button></div>`);
    m.querySelector(".ok").addEventListener("click", ev => { ev.target.parentElement.innerHTML = '<span style="color:var(--ok);font-weight:700">מעולה, בהצלחה!</span>'; });
    m.querySelector(".more").addEventListener("click", ev => { ev.target.parentElement.remove(); askClaude(q, h); });
    addKeep(m, h.q, h.a, null);
    return;
  }
  askClaude(q, hits[0]?.e);
}

const SYSTEM = "שמך Volt, המערכת החכמה של מכללת וולט. אתה מרצה סבלני במכללה להנדסאי חשמל בישראל (מגמת חשמל: שנה א יסודות, שנה ב מכונות חשמל ובקרת הספק, שנה ג מערכות הספק ומתקני חשמל, ופרויקט גמר). ענה בעברית, קצר וברור, ברמה של סטודנט להנדסאי. בשאלת חישוב: כתוב את הנוסחה, הצב מספרים עם יחידות, ותן תוצאה סופית. כשסטודנט מבקש פתרון לשיעורי בית, הדרך אותו צעד אחר צעד במקום לתת רק תשובה. אם השאלה נוגעת לתקנות החשמל, ציין שהערכים צריכים אימות מול נוסח התקנות העדכני. אל תמציא נתונים.";

async function askClaude(q, near, pic){
  const wait = bot('<span class="typing" aria-label="Volt חושב"><i></i><i></i><i></i></span>');
  const ctxLine = [ctx ? "הסטודנט שואל במסגרת: " + ctx.label : "", near ? "תשובה קרובה מהמאגר (ייתכן שלא מספיקה): " + near.a : ""].filter(Boolean).join("\n");
  const userTurn = (ctxLine ? ctxLine + "\n\n" : "") + (pic ? "הסטודנט צירף תמונה של שאלה. קרא אותה בעיון, כולל שרטוטים ומספרים.\n" : "") + "שאלה: " + q;
  const histTurn = (pic ? "[צורפה תמונה] " : "") + userTurn;
  try {
    let answer, ansId = null;
    if (sampleFn) {
      const opts = {};
      if (pic) { if (!imgOK) throw new Error("שליחת תמונות לא זמינה כאן. כתבו את השאלה במילים."); opts.images = [pic.blob]; }
      const r = await sampleFn([{role:"user", content:SYSTEM}, {role:"assistant", content:"הבנתי. אענה כמרצה."}, ...chat.slice(-6), {role:"user", content:userTurn}], opts);
      answer = r.text;
    } else if (CONFIG.webhookUrl) {
      const res = await fetch(CONFIG.webhookUrl, {method:"POST", body:JSON.stringify({question:q, context:ctxLine, history:chat.slice(-6), image: pic ? {media_type:"image/jpeg", data:pic.b64} : undefined})});
      const j = await res.json(); if (j.error) throw new Error(j.error); answer = j.answer; ansId = j.id || null;
    } else {
      wait.remove();
      addMsg("b err", `<b>עדיין אין חיבור ל-Volt.</b><br>${pic ? "שאלה בתמונה" : "שאלה שאין לה תשובה במאגר"} דורשת את Volt. המרצה צריך להגדיר את החיבור (כתובת ה-Apps Script) כדי שאפשר יהיה לשאול כל שאלה.`);
      return;
    }
    chat.push({role:"user", content:histTurn}, {role:"assistant", content:answer});
    wait.remove();
    const am = bot(`<span class="src ai">Volt</span><br>${md(answer)}`);
    addKeep(am, pic ? (q + " (שאלה מתמונה)") : q, answer, ansId);
  } catch (err) {
    wait.remove();
    const code = err && err.code;
    addMsg("b err", code === "rate_limited" ? "יותר מדי שאלות ברגע אחד. נסו שוב בעוד דקה." : `<b>לא הצלחתי לקבל תשובה.</b><br>${esc(err && err.message || "בדקו את החיבור ונסו שוב.")}`);
  }
}

function lsGet(key){ try { return localStorage.getItem(key) || ""; } catch (e) { return ""; } }

function mailForm(k, id){
  k.innerHTML = `<form><label class="sr" for="em-${id}">כתובת מייל</label><input id="em-${id}" type="email" required placeholder="name@example.com" value="${esc(lsGet("volt-email"))}"><button type="submit" class="go" style="min-height:36px;padding:4px 14px">שליחה</button></form><span class="note"></span>`;

/* ציור הפתרון על קנבס */
function plainLines(a){
  return a.split("\n").map(l => {
    let t = l.replace(/^#{1,4}\s*/, ""), bold = false;
    if (/^\s*\*\*.+\*\*\s*$/.test(t) || /^#{1,4}\s/.test(l)) bold = true;
    t = t.replace(/\*\*(.+?)\*\*/g, "$1").replace(/`([^`]+)`/g, "$1");
    const li = t.match(/^\s*(?:[-*•])\s+(.*)/); if (li) t = "• " + li[1];
    return {t, bold};
  });
}
function wrap(g, text, maxW){
  const words = text.split(/\s+/), out = []; let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (g.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
  }
  out.push(line); return out;
}
async function renderPNG(q, a){
  try { await document.fonts.ready; } catch (e) {}
  const W = 1080, P = 64, maxW = W - P * 2, body = 34, lh = 54;
  const cv = document.createElement("canvas"), g = cv.getContext("2d");
  const fBody = `500 ${body}px Assistant, Arial, sans-serif`, fBold = `800 ${body}px Assistant, Arial, sans-serif`, fQ = `400 44px "Secular One", Arial, sans-serif`;
  g.direction = "rtl";
  g.font = fQ; const qLines = wrap(g, q, maxW);
  const rows = [];
  for (const L of plainLines(a)) { if (!L.t.trim()) { rows.push({t:"", gap:true}); continue; } g.font = L.bold ? fBold : fBody; for (const w of wrap(g, L.t, maxW)) rows.push({t:w, bold:L.bold}); }
  const H = 150 + qLines.length * 60 + 40 + rows.reduce((h, r) => h + (r.gap ? 22 : lh), 0) + 120;
  cv.width = W; cv.height = H; g.direction = "rtl"; g.textBaseline = "alphabetic";
  g.fillStyle = "#f4f7fa"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#10202f"; g.fillRect(0, 0, W, 110);
  g.fillStyle = "#f2b705"; g.fillRect(0, 110, W, 8);
  g.textAlign = "right"; g.fillStyle = "#ffffff"; g.font = `400 40px "Secular One", Arial, sans-serif`; g.fillText("מכללת וולט", W - P, 70);
  g.textAlign = "left"; g.fillStyle = "#f2b705"; g.font = `700 26px "JetBrains Mono", monospace`; g.fillText("VOLT", P, 68);
  let y = 190; g.textAlign = "right"; g.fillStyle = "#0b5cad"; g.font = fQ;
  for (const l of qLines) { g.fillText(l, W - P, y); y += 60; }
  g.fillStyle = "#d3dde7"; g.fillRect(P, y - 20, maxW, 2); y += 40;
  g.fillStyle = "#10202f";
  for (const r of rows) { if (r.gap) { y += 22; continue; } g.font = r.bold ? fBold : fBody; g.fillText(r.t, W - P, y); y += lh; }
  g.fillStyle = "#526477"; g.font = `500 24px Assistant, Arial, sans-serif`;
  g.fillText("הפתרון נוצר על ידי Volt · " + new Date().toLocaleDateString("he-IL"), W - P, H - 50);
  return new Promise(ok => cv.toBlob(b => ok({blob:b, url:cv.toDataURL("image/png")}), "image/png"));
}
async function saveImage(q, a, btn){
  btn.disabled = true;
  try {
    const {blob, url} = await renderPNG(q, a);
    const file = new File([blob], "volt-solution.png", {type:"image/png"});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      try { await navigator.share({files:[file], title:"פתרון מ-Volt"}); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    showShot(url, blob);
  } catch (e) { addMsg("b err", "לא הצלחתי ליצור את התמונה. נסו שוב."); }
  finally { btn.disabled = false; }
}
function showShot(url, blob){
  const o = document.createElement("div"); o.className = "shot"; o.dir = "rtl"; o.setAttribute("role", "dialog"); o.setAttribute("aria-label", "הפתרון כתמונה");
  o.innerHTML = `<p>בטלפון: לחיצה ארוכה על התמונה ← "שמירה בתמונות"</p><img alt="הפתרון כתמונה" src="${url}">
    <div class="row">${dlFn ? '<button class="btn dl" type="button">הורדה</button>' : `<a class="btn" href="${url}" download="volt-solution.png">הורדה</a>`}<button class="btn cl" type="button">סגירה</button></div><p class="dlnote" hidden></p>`;
  o.querySelector(".cl").addEventListener("click", () => o.remove());
  const d = o.querySelector(".dl");
  if (d) d.addEventListener("click", async () => {
    const n = o.querySelector(".dlnote");
    try { await dlFn.save({filename:"volt-solution.png", data:blob}); n.hidden = true; }
    catch (e) { if (e && e.code === "declined") return; n.textContent = "ההורדה לא זמינה כאן. אפשר לשמור בלחיצה ארוכה על התמונה."; n.hidden = false; }
  });
  o.addEventListener("click", e => { if (e.target === o) o.remove(); });
  document.body.appendChild(o);
}

/* תמונה: צילום או גלריה. מוקטנת בדפדפן ל-1600 פיקסלים לפני השליחה */
let img = null;  // {blob, b64, url}
async function prepImage(file){
  if (!file || !file.type.startsWith("image/")) throw new Error("זה לא קובץ תמונה.");
  const url0 = URL.createObjectURL(file);
  try {
    const im = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error("לא הצלחתי לפתוח את התמונה. נסו לצלם שוב או לבחור קובץ JPG.")); i.src = url0; });
    const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
    const g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(im, 0, 0, cv.width, cv.height);
    const dataUrl = cv.toDataURL("image/jpeg", 0.85);
    const blob = await (await fetch(dataUrl)).blob();
    return {blob, b64:dataUrl.split(",")[1], url:dataUrl};
  } finally { URL.revokeObjectURL(url0); }
}
async function onPick(e){
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  try { img = await prepImage(f); $("#attImg").src = img.url; $("#attach").hidden = false; $("#qIn").focus(); }
  catch (err) { addMsg("b err", esc(err.message)); }
}
$("#camIn").addEventListener("change", onPick);
$("#galIn").addEventListener("change", onPick);
$("#camBtn").addEventListener("click", () => $("#camIn").click());
$("#galBtn").addEventListener("click", () => $("#galIn").click());
function clearImg(){ img = null; $("#attach").hidden = true; $("#attImg").removeAttribute("src"); }
$("#attDel").addEventListener("click", clearImg);

$("#compose").addEventListener("submit", e => {
  e.preventDefault(); const v = $("#qIn").value.trim();
  if (img) { const pic = img; clearImg(); $("#qIn").value = ""; askImage(v, pic); return; }
  if (!v) return; $("#qIn").value = ""; ask(v);
});
function askImage(text, pic){
  const m = addMsg("u", ""); const i = document.createElement("img"); i.src = pic.url; i.alt = "השאלה בתמונה"; m.appendChild(i);
  if (text) m.appendChild(document.createTextNode(text));
  askClaude(text || "פתרו את השאלה שבתמונה והסבירו את הדרך.", null, pic);
}
$("#qIn").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#compose").requestSubmit(); } });

function setStatus(){ const on = !!(sampleFn || CONFIG.webhookUrl); const s = $("#aiStatus"); s.textContent = on ? "Volt מחובר" : "מאגר בלבד"; s.classList.toggle("on", on); }
(async () => {
  try { if (window.claude && claude.use) { const s = await claude.use("sample"); if (s) { sampleFn = s; try { imgOK = !!(await s.limits()).images; } catch (e) {} } const d = await claude.use("downloads"); if (d) dlFn = d; } } catch (e) {}
  setStatus();
})();
setStatus();
render();
